services:
  - type: web
    name: ai-career-agent-site
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # Render's pre-deploy command is unavailable on the free web plan. The
    # migration therefore runs before Gunicorn starts. When the service moves
    # to a paid plan or VPS, move this command into the dedicated pre-deploy
    # phase/entrypoint.
    startCommand: python scripts/manage_db.py upgrade && python scripts/start_runtime.py
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_NAME
        value: ai-career-agent
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_EMAIL_BACKEND
        value: disabled
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: AUTH_EMAIL_FROM_NAME
        value: AI Career Agent
      - key: AUTH_SMTP_HOST
        sync: false
      - key: AUTH_SMTP_PORT
        value: "587"
      - key: AUTH_SMTP_USERNAME
        sync: false
      - key: AUTH_SMTP_PASSWORD
        sync: false
      - key: AUTH_SMTP_USE_TLS
        value: "1"
      - key: AUTH_SMTP_USE_SSL
        value: "0"
      - key: AUTH_SMTP_TIMEOUT_SECONDS
        value: "8"
      - key: AUTH_GMAIL_CLIENT_ID
        sync: false
      - key: AUTH_GMAIL_CLIENT_SECRET
        sync: false
      - key: AUTH_GMAIL_REFRESH_TOKEN
        sync: false
      - key: AUTH_GMAIL_TIMEOUT_SECONDS
        value: "8"
      - key: AUTH_SESSION_TTL_SECONDS
        value: "43200"
      - key: AUTH_VERIFICATION_TTL_SECONDS
        value: "86400"
      - key: AUTH_RESET_TTL_SECONDS
        value: "3600"
      - key: AUTH_PASSWORD_MIN_LENGTH
        value: "12"
      - key: PRIVACY_CLEANUP_ENABLED
        value: "1"
      - key: PRIVACY_CLEANUP_INTERVAL_SECONDS
        value: "86400"
      - key: PRIVACY_PENDING_ACCOUNT_RETENTION_DAYS
        value: "30"
      - key: PRIVACY_AUTH_ARTIFACT_RETENTION_DAYS
        value: "30"
      - key: PRIVACY_AUDIT_RETENTION_DAYS
        value: "180"
      - key: SEARCH_ADMIN_EMAILS
        sync: false
      - key: SOURCE_HEALTH_RECORDING_ENABLED
        value: "1"
      - key: SOURCE_HEALTH_STALE_SECONDS
        value: "900"
      - key: SEARCH_SNAPSHOT_TTL_SECONDS
        value: "1800"
      - key: SEARCH_SNAPSHOT_MAX_CANDIDATES
        value: "1200"
      - key: SEARCH_SNAPSHOT_MAX_PAGES_PER_SOURCE
        value: "8"
      - key: SEARCH_SNAPSHOT_MAX_ROUNDS_PER_REQUEST
        value: "1"
      - key: SEARCH_SNAPSHOT_BUFFER_ITEMS
        value: "1"
      - key: SEARCH_SNAPSHOT_EXTENSION_LEASE_SECONDS
        value: "90"
      - key: TRUDVSEM_SYNC_ENABLED
        value: "1"
      - key: TRUDVSEM_SYNC_INTERVAL
        value: "1800"
      - key: TRUDVSEM_SYNC_ITEMS
        value: "300"
      - key: TRUDVSEM_SYNC_BATCH
        value: "10"
      - key: TRUDVSEM_SYNC_POLL_SECONDS
        value: "15"
      - key: TRUDVSEM_SYNC_STALE_SECONDS
        value: "900"
      - key: TRUDVSEM_WORKER_HEARTBEAT_SECONDS
        value: "15"
      - key: TRUDVSEM_SYNC_WATERMARK_OVERLAP_SECONDS
        value: "300"
      - key: TRUDVSEM_VACANCY_TTL_DAYS
        value: "45"
      - key: TRUDVSEM_CLOSED_RETENTION_DAYS
        value: "30"
      - key: TRUDVSEM_RETRY_BASE_SECONDS
        value: "60"
      - key: TRUDVSEM_RETRY_MAX_SECONDS
        value: "3600"

# SYNC-001 and PRIV-001 run background workers as sibling OS processes on the
# current free web service. On a paid Render plan or VPS, deploy both workers as
# independent background workers/Compose services instead.
