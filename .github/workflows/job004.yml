name: JOB-004 package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/check_job004_package.py
      - run: pytest -q tests/test_job004_service.py tests/test_job004_routes.py tests/test_job004_package.py
