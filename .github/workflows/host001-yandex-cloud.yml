name: HOST-001 Yandex Cloud foundation

"on":
  push:
    paths:
      - "infra/yandex-cloud/**"
      - "docs/HOST001_*.md"
      - "docs/LEGAL001_OWNER_DECISIONS_20260924.md"
      - "scripts/check_host001_package.py"
      - "scripts/host001_stage_c_revision_gate.py"
      - "scripts/host001_stage_c_plan_hardening.py"
      - "tests/test_host001_package.py"
      - "tests/test_host001_stage_c_revision_gate.py"
      - "database.py"
      - "migrations/versions/**"
      - ".github/workflows/host001-yandex-cloud.yml"
      - ".github/workflows/host001-stage-c-plan.yml"
      - ".github/workflows/host001-stage-c-apply.yml"
      - ".github/workflows/host001-stage-c-teardown.yml"
      - "domain/ai.py"
      - "services/legal_policy.py"
  pull_request:
    paths:
      - "infra/yandex-cloud/**"
      - "docs/HOST001_*.md"
      - "docs/LEGAL001_OWNER_DECISIONS_20260924.md"
      - "scripts/check_host001_package.py"
      - "scripts/host001_stage_c_revision_gate.py"
      - "scripts/host001_stage_c_plan_hardening.py"
      - "tests/test_host001_package.py"
      - "tests/test_host001_stage_c_revision_gate.py"
      - "database.py"
      - "migrations/versions/**"
      - ".github/workflows/host001-yandex-cloud.yml"
      - ".github/workflows/host001-stage-c-plan.yml"
      - ".github/workflows/host001-stage-c-apply.yml"
      - ".github/workflows/host001-stage-c-teardown.yml"
      - "domain/ai.py"
      - "services/legal_policy.py"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform/static no-apply validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install HOST-001 crypto test dependency
        run: python -m pip install cryptography==48.0.1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: HOST-001 package guard
        run: python scripts/check_host001_package.py

      - name: HOST-001 unit tests
        run: python -m unittest tests.test_host001_package -v

      - name: Offline Stage C Alembic revision gate
        run: python -m unittest tests.test_host001_stage_c_revision_gate -v

      - name: Verify exact offline Stage C checkout contract
        run: python scripts/host001_stage_c_revision_gate.py --expected-sha "$GITHUB_SHA"

      - name: Terraform format
        run: terraform -chdir=infra/yandex-cloud fmt -check -diff -recursive

      - name: Terraform init without backend
        run: terraform -chdir=infra/yandex-cloud init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/yandex-cloud validate
