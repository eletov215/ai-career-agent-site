name: HOST-001 Stage C bounded apply + automatic teardown

"on":
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H. Creates billable synthetic-only resources and tears them down automatically."
        required: true
        type: string
      hold_minutes:
        description: "Synthetic field-test hold window after apply. Allowed 15-180 minutes."
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: host001-stage-c-bounded-apply
  cancel-in-progress: false

jobs:
  apply_and_teardown:
    name: Bounded Stage C apply and deterministic teardown
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 235
    environment: stage-c-yandex

    env:
      TF_VAR_app_zone: ru-central1-d
      TF_VAR_db_secondary_zone: ru-central1-b
      TF_VAR_postgresql_host_profile: single
      TF_VAR_vm_cores: "2"
      TF_VAR_vm_memory_gb: "4"
      TF_VAR_vm_disk_gb: "40"
      TF_VAR_postgresql_resource_preset_id: s3-c2-m8
      TF_VAR_postgresql_disk_type_id: network-ssd
      TF_VAR_postgresql_disk_size_gb: "20"
      TF_VAR_postgresql_backup_retain_days: "7"
      TF_VAR_field_test_resources_enabled: "true"
      TF_VAR_foundation_deletion_protection: "false"
      TF_VAR_field_test_restore_resource_preset_id: s3-c2-m8
      TF_VAR_field_test_restore_disk_size_gb: "20"
      TF_VAR_field_test_bucket_max_size_bytes: "1073741824"

    steps:
      - name: Enforce owner authorization and bounded hold window
        shell: bash
        env:
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          STAGE_C_HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          test "$STAGE_C_ACKNOWLEDGEMENT" = "APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H" || {
            echo "Refusing to run: acknowledgement must be APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H."
            exit 1
          }
          [[ "$STAGE_C_HOLD_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "hold_minutes must be an integer."
            exit 1
          }
          test "$STAGE_C_HOLD_MINUTES" -ge 15
          test "$STAGE_C_HOLD_MINUTES" -le 180

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify exact main execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"

      - name: Materialize Yandex service-account key outside repository
        shell: bash
        env:
          YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" || {
            echo "Missing protected Stage C service-account key."
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/yc-stage-c-key.json"
          printf '%s' "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" > "$key_file"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "yc-stage-c-key.json")
          data = json.load(open(path, encoding="utf-8"))
          required = {"id", "service_account_id", "private_key"}
          if not required.issubset(data):
              raise SystemExit("Invalid Yandex service-account key structure")
          PY
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/yandex-cloud init -backend=false -input=false
          terraform -chdir=infra/yandex-cloud validate

      - name: Controlled Stage C lifecycle
        shell: bash
        env:
          STAGE_C_HOLD_MINUTES: ${{ inputs.hold_minutes }}
          TF_VAR_cloud_id: ${{ secrets.YC_STAGE_C_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_STAGE_C_FOLDER_ID }}
          TF_VAR_admin_cidr: ${{ secrets.YC_STAGE_C_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.YC_STAGE_C_SSH_PUBLIC_KEY }}
          TF_VAR_postgresql_app_password: ${{ secrets.YC_STAGE_C_POSTGRES_PASSWORD }}
          TF_VAR_field_test_restore_password: ${{ secrets.YC_STAGE_C_RESTORE_PASSWORD }}
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/stage-c-apply.tfplan"
          plan_json="$RUNNER_TEMP/stage-c-apply-plan.json"
          plan_log="$RUNNER_TEMP/stage-c-apply-plan.stdout"
          apply_log="$RUNNER_TEMP/stage-c-apply.stdout"
          destroy_plan="$RUNNER_TEMP/stage-c-destroy.tfplan"
          destroy_json="$RUNNER_TEMP/stage-c-destroy-plan.json"
          destroy_log="$RUNNER_TEMP/stage-c-destroy.stdout"
          apply_started=0
          teardown_complete=0

          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e
            if [ "$apply_started" -eq 1 ] && [ "$teardown_complete" -eq 0 ]; then
              echo "Emergency cleanup: attempting Terraform destroy before runner exit."
              terraform -chdir=infra/yandex-cloud destroy                 -auto-approve                 -input=false                 -lock=false                 -no-color >"$destroy_log" 2>&1
              destroy_status=$?
              if [ "$destroy_status" -ne 0 ]; then
                echo "EMERGENCY TEARDOWN FAILED. Inspect Yandex Cloud immediately for HOST-001 resources."
                status=1
              else
                echo "Emergency teardown completed."
              fi
            fi
            rm -f               "$plan_file"               "$plan_json"               "$plan_log"               "$apply_log"               "$destroy_plan"               "$destroy_json"               "$destroy_log"               "$RUNNER_TEMP/yc-stage-c-key.json"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM

          required=(
            TF_VAR_cloud_id
            TF_VAR_folder_id
            TF_VAR_admin_cidr
            TF_VAR_ssh_public_key
            TF_VAR_postgresql_app_password
            TF_VAR_field_test_restore_password
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "Missing protected Stage C input: $name"
              exit 1
            }
          done
          test "$TF_VAR_admin_cidr" != "0.0.0.0/0"
          test "${#TF_VAR_postgresql_app_password}" -ge 16
          test "${#TF_VAR_field_test_restore_password}" -ge 16

          set +e
          terraform -chdir=infra/yandex-cloud plan             -input=false             -lock=false             -no-color             -detailed-exitcode             -out="$plan_file" >"$plan_log" 2>&1
          plan_code=$?
          set -e
          if [ "$plan_code" -ne 2 ]; then
            echo "Refusing apply: fresh Stage C plan must contain reviewed create changes (exit 2)."
            exit 1
          fi

          terraform -chdir=infra/yandex-cloud show -json "$plan_file" > "$plan_json"

          jq -r '
            .resource_changes[]?
            | [.address, (.change.actions | join(","))]
            | @tsv
          ' "$plan_json" | sort

          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "create" or . == "read" or . == "no-op")
            )
          ' "$plan_json" >/dev/null || {
            echo "Refusing apply: plan contains a destructive or replacement action."
            exit 1
          }

          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$plan_json" >/dev/null || {
            echo "Refusing apply: plan contains a resource outside the reviewed Stage C allowlist."
            exit 1
          }

          echo "Fresh credentialed create-only plan passed. Starting owner-authorized Stage C apply."
          apply_started=1
          set +e
          terraform -chdir=infra/yandex-cloud apply             -auto-approve             -input=false             -lock=false             -no-color             "$plan_file" >"$apply_log" 2>&1
          apply_code=$?
          set -e
          if [ "$apply_code" -ne 0 ]; then
            echo "Terraform apply failed. Apply output is withheld from logs; emergency teardown will run."
            exit "$apply_code"
          fi

          public_ip="$(terraform -chdir=infra/yandex-cloud output -raw app_public_ipv4)"
          pg_fqdn="$(terraform -chdir=infra/yandex-cloud output -raw postgresql_rw_fqdn)"
          runtime_secret="$(terraform -chdir=infra/yandex-cloud output -raw runtime_lockbox_secret_id)"
          backup_bucket="$(terraform -chdir=infra/yandex-cloud output -raw field_test_backup_bucket)"
          backup_secret="$(terraform -chdir=infra/yandex-cloud output -raw field_test_backup_lockbox_secret_id)"
          restore_fqdn="$(terraform -chdir=infra/yandex-cloud output -raw field_test_restore_rw_fqdn)"

          echo "STAGE C RESOURCES ARE LIVE."
          echo "Public IPv4: $public_ip"
          echo "PostgreSQL RW FQDN: $pg_fqdn"
          echo "Runtime Lockbox secret ID: $runtime_secret"
          echo "Field-test backup bucket: $backup_bucket"
          echo "Field-test backup Lockbox secret ID: $backup_secret"
          echo "Restore PostgreSQL RW FQDN: $restore_fqdn"
          echo "Automatic teardown starts after $STAGE_C_HOLD_MINUTES hold minutes."

          {
            echo "### HOST-001 Stage C bounded apply"
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Owner ceiling: **1,000 RUB total / <=4 hours**"
            echo "- Synthetic-only resources: **LIVE during this workflow only**"
            echo "- Public IPv4: `$public_ip`"
            echo "- PostgreSQL RW FQDN: `$pg_fqdn`"
            echo "- Runtime Lockbox secret ID: `$runtime_secret`"
            echo "- Backup bucket: `$backup_bucket`"
            echo "- Backup Lockbox secret ID: `$backup_secret`"
            echo "- Restore PostgreSQL RW FQDN: `$restore_fqdn`"
            echo "- Production data / Render / Neon / MIG-001 / real-data AI / email: **FORBIDDEN**"
            echo "- Automatic teardown hold: **$STAGE_C_HOLD_MINUTES minutes**"
          } >> "$GITHUB_STEP_SUMMARY"

          remaining=$((STAGE_C_HOLD_MINUTES * 60))
          while [ "$remaining" -gt 0 ]; do
            chunk=900
            if [ "$remaining" -lt "$chunk" ]; then
              chunk="$remaining"
            fi
            echo "Stage C synthetic field window: $(( (remaining + 59) / 60 )) minute(s) remaining."
            sleep "$chunk"
            remaining=$((remaining - chunk))
          done

          echo "Hold window ended. Building reviewed destroy plan."
          set +e
          terraform -chdir=infra/yandex-cloud plan             -destroy             -input=false             -lock=false             -no-color             -detailed-exitcode             -out="$destroy_plan" >"$destroy_log" 2>&1
          destroy_plan_code=$?
          set -e
          if [ "$destroy_plan_code" -ne 2 ]; then
            echo "Expected destroy changes were not produced; emergency teardown will run."
            exit 1
          fi

          terraform -chdir=infra/yandex-cloud show -json "$destroy_plan" > "$destroy_json"

          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "delete" or . == "read" or . == "no-op")
            )
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains an unexpected non-delete action; emergency teardown will run."
            exit 1
          }

          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains a resource outside the reviewed Stage C allowlist."
            exit 1
          }

          set +e
          terraform -chdir=infra/yandex-cloud apply             -auto-approve             -input=false             -lock=false             -no-color             "$destroy_plan" >"$destroy_log" 2>&1
          destroy_code=$?
          set -e
          if [ "$destroy_code" -ne 0 ]; then
            echo "Normal teardown failed; emergency teardown will run."
            exit "$destroy_code"
          fi

          managed_count="$(terraform -chdir=infra/yandex-cloud state list 2>/dev/null | grep -vc '^data\.' || true)"
          test "$managed_count" -eq 0 || {
            echo "Managed resources remain in Terraform state after teardown."
            exit 1
          }

          teardown_complete=1
          apply_started=0
          echo "Stage C teardown verified: no managed Terraform resources remain."

      - name: Record completed bounded lifecycle
        if: success()
        shell: bash
        run: |
          {
            echo
            echo "### Teardown result"
            echo
            echo "- Terraform managed resources after bounded lifecycle: **0**"
            echo "- Apply/destroy boundary: **completed in the same ephemeral runner**"
            echo "- No Terraform state artifact was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove service-account key material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/yc-stage-c-key.json"
