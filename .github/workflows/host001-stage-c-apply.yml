name: HOST-001 Stage C bounded apply

"on":
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Type APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H. Creates only the reviewed synthetic Stage C resources."
        required: true
        type: string
      hold_minutes:
        description: "Automatic teardown delay after recovery state is durable. Allowed 15-150 minutes."
        required: true
        default: "120"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: host001-stage-c-bounded-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Bounded Stage C apply and recovery handoff
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: stage-c-yandex

    env:
      TF_VAR_app_zone: ru-central1-d
      TF_VAR_db_secondary_zone: ru-central1-b
      TF_VAR_postgresql_host_profile: single
      TF_VAR_vm_cores: "2"
      TF_VAR_vm_memory_gb: "4"
      TF_VAR_vm_disk_gb: "40"
      TF_VAR_postgresql_resource_preset_id: s3-c2-m8
      TF_VAR_postgresql_disk_type_id: network-ssd
      TF_VAR_postgresql_disk_size_gb: "20"
      TF_VAR_postgresql_backup_retain_days: "7"
      TF_VAR_field_test_resources_enabled: "true"
      TF_VAR_foundation_deletion_protection: "false"
      TF_VAR_field_test_restore_resource_preset_id: s3-c2-m8
      TF_VAR_field_test_restore_disk_size_gb: "20"
      TF_VAR_field_test_bucket_max_size_bytes: "1073741824"

    steps:
      - name: Enforce owner authorization and bounded hold window
        shell: bash
        env:
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          STAGE_C_HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          test "$STAGE_C_ACKNOWLEDGEMENT" = "APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H" || {
            echo "Refusing to run: acknowledgement must be APPLY_STAGE_C_SYNTHETIC_1000_RUB_4H."
            exit 1
          }
          [[ "$STAGE_C_HOLD_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "hold_minutes must be an integer."
            exit 1
          }
          test "$STAGE_C_HOLD_MINUTES" -ge 15
          test "$STAGE_C_HOLD_MINUTES" -le 150

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify exact main execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"

      - name: Materialize Yandex service-account key outside repository
        shell: bash
        env:
          YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" || {
            echo "Missing protected Stage C service-account key."
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/yc-stage-c-key.json"
          printf '%s' "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" > "$key_file"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "yc-stage-c-key.json")
          data = json.load(open(path, encoding="utf-8"))
          required = {"id", "service_account_id", "private_key"}
          if not required.issubset(data):
              raise SystemExit("Invalid Yandex service-account key structure")
          PY
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Terraform init and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/yandex-cloud init -backend=false -input=false
          terraform -chdir=infra/yandex-cloud validate

      - name: Fresh reviewed plan and owner-authorized apply
        id: apply
        continue-on-error: true
        shell: bash
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_STAGE_C_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_STAGE_C_FOLDER_ID }}
          TF_VAR_admin_cidr: ${{ secrets.YC_STAGE_C_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.YC_STAGE_C_SSH_PUBLIC_KEY }}
          TF_VAR_postgresql_app_password: ${{ secrets.YC_STAGE_C_POSTGRES_PASSWORD }}
          TF_VAR_field_test_restore_password: ${{ secrets.YC_STAGE_C_RESTORE_PASSWORD }}
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/stage-c-apply.tfplan"
          plan_json="$RUNNER_TEMP/stage-c-apply-plan.json"
          plan_log="$RUNNER_TEMP/stage-c-apply-plan.stdout"
          apply_log="$RUNNER_TEMP/stage-c-apply.stdout"

          required=(
            TF_VAR_cloud_id
            TF_VAR_folder_id
            TF_VAR_admin_cidr
            TF_VAR_ssh_public_key
            TF_VAR_postgresql_app_password
            TF_VAR_field_test_restore_password
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "Missing protected Stage C input: $name"
              exit 1
            }
          done
          test "$TF_VAR_admin_cidr" != "0.0.0.0/0"
          test "${#TF_VAR_postgresql_app_password}" -ge 16
          test "${#TF_VAR_field_test_restore_password}" -ge 16

          set +e
          terraform -chdir=infra/yandex-cloud plan \
            -input=false \
            -lock=false \
            -no-color \
            -detailed-exitcode \
            -out="$plan_file" >"$plan_log" 2>&1
          plan_code=$?
          set -e
          if [ "$plan_code" -ne 2 ]; then
            echo "Refusing apply: fresh Stage C plan must contain reviewed create changes (exit 2)."
            echo "state_present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          terraform -chdir=infra/yandex-cloud show -json "$plan_file" > "$plan_json"

          jq -r '
            .resource_changes[]?
            | [.address, (.change.actions | join(","))]
            | @tsv
          ' "$plan_json" | sort

          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "create" or . == "read" or . == "no-op")
            )
          ' "$plan_json" >/dev/null || {
            echo "Refusing apply: plan contains a destructive or replacement action."
            echo "state_present=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$plan_json" >/dev/null || {
            echo "Refusing apply: plan contains a resource outside the reviewed Stage C allowlist."
            echo "state_present=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          echo "Fresh credentialed create-only plan passed. Starting owner-authorized Stage C apply."
          set +e
          terraform -chdir=infra/yandex-cloud apply \
            -auto-approve \
            -input=false \
            -lock=false \
            -no-color \
            "$plan_file" >"$apply_log" 2>&1
          apply_code=$?
          set -e

          if [ -s infra/yandex-cloud/terraform.tfstate ]; then
            echo "state_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_present=false" >> "$GITHUB_OUTPUT"
          fi
          echo "apply_code=$apply_code" >> "$GITHUB_OUTPUT"

          if [ "$apply_code" -ne 0 ]; then
            echo "Terraform apply failed. Output is withheld; durable recovery will be attempted if state exists."
            exit "$apply_code"
          fi

          echo "public_ip=$(terraform -chdir=infra/yandex-cloud output -raw app_public_ipv4)" >> "$GITHUB_OUTPUT"
          echo "pg_fqdn=$(terraform -chdir=infra/yandex-cloud output -raw postgresql_rw_fqdn)" >> "$GITHUB_OUTPUT"
          echo "runtime_secret=$(terraform -chdir=infra/yandex-cloud output -raw runtime_lockbox_secret_id)" >> "$GITHUB_OUTPUT"
          echo "backup_bucket=$(terraform -chdir=infra/yandex-cloud output -raw field_test_backup_bucket)" >> "$GITHUB_OUTPUT"
          echo "backup_secret=$(terraform -chdir=infra/yandex-cloud output -raw field_test_backup_lockbox_secret_id)" >> "$GITHUB_OUTPUT"
          echo "restore_fqdn=$(terraform -chdir=infra/yandex-cloud output -raw field_test_restore_rw_fqdn)" >> "$GITHUB_OUTPUT"

      - name: Encrypt durable recovery state
        id: encrypt_state
        if: always() && steps.apply.outputs.state_present == 'true'
        shell: bash
        env:
          TFSTATE_PASSPHRASE: ${{ secrets.YC_STAGE_C_TFSTATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$TFSTATE_PASSPHRASE" || {
            echo "Missing protected Stage C Terraform-state passphrase."
            exit 1
          }
          test -s infra/yandex-cloud/terraform.tfstate
          umask 077
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in infra/yandex-cloud/terraform.tfstate \
            -out "$RUNNER_TEMP/stage-c-tfstate.enc" \
            -pass env:TFSTATE_PASSPHRASE
          test -s "$RUNNER_TEMP/stage-c-tfstate.enc"

      - name: Upload encrypted recovery state
        id: upload_state
        if: always() && steps.apply.outputs.state_present == 'true' && steps.encrypt_state.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host001-stage-c-state-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-c-tfstate.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Dispatch cancellation-surviving teardown
        id: dispatch_teardown
        if: always() && steps.apply.outputs.state_present == 'true' && steps.upload_state.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          REQUESTED_HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          if [ "$APPLY_OUTCOME" = "success" ]; then
            delay="$REQUESTED_HOLD_MINUTES"
          else
            delay="0"
          fi
          payload="$(
            python - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$delay" <<'PY'
          import json, sys
          sha, run_id, delay = sys.argv[1:]
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "acknowledgement": "AUTO_TEARDOWN_STAGE_C_SYNTHETIC",
                  "source_sha": sha,
                  "source_run_id": run_id,
                  "delay_minutes": delay,
              },
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/host001-stage-c-teardown.yml/dispatches" \
            -d "$payload"
          echo "teardown_delay_minutes=$delay" >> "$GITHUB_OUTPUT"

      - name: Immediate local fallback teardown
        id: fallback_teardown
        if: always() && steps.apply.outputs.state_present == 'true' && steps.dispatch_teardown.outcome != 'success'
        shell: bash
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_STAGE_C_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_STAGE_C_FOLDER_ID }}
          TF_VAR_admin_cidr: ${{ secrets.YC_STAGE_C_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.YC_STAGE_C_SSH_PUBLIC_KEY }}
          TF_VAR_postgresql_app_password: ${{ secrets.YC_STAGE_C_POSTGRES_PASSWORD }}
          TF_VAR_field_test_restore_password: ${{ secrets.YC_STAGE_C_RESTORE_PASSWORD }}
        run: |
          set -euo pipefail
          destroy_plan="$RUNNER_TEMP/stage-c-fallback-destroy.tfplan"
          destroy_json="$RUNNER_TEMP/stage-c-fallback-destroy.json"
          destroy_log="$RUNNER_TEMP/stage-c-fallback-destroy.stdout"

          echo "Durable teardown handoff failed; performing immediate local fallback teardown."
          set +e
          terraform -chdir=infra/yandex-cloud plan \
            -destroy \
            -input=false \
            -lock=false \
            -no-color \
            -detailed-exitcode \
            -out="$destroy_plan" >"$destroy_log" 2>&1
          plan_code=$?
          set -e
          test "$plan_code" -eq 2

          terraform -chdir=infra/yandex-cloud show -json "$destroy_plan" > "$destroy_json"
          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "delete" or . == "read" or . == "no-op")
            )
          ' "$destroy_json" >/dev/null
          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$destroy_json" >/dev/null

          terraform -chdir=infra/yandex-cloud apply \
            -auto-approve \
            -input=false \
            -lock=false \
            -no-color \
            "$destroy_plan" >"$destroy_log" 2>&1

          managed_count="$(terraform -chdir=infra/yandex-cloud state list 2>/dev/null | grep -vc '^data\.' || true)"
          test "$managed_count" -eq 0
          echo "Immediate local fallback teardown completed."

      - name: Record Stage C handoff
        if: always() && steps.apply.outcome == 'success' && steps.dispatch_teardown.outcome == 'success'
        shell: bash
        env:
          PUBLIC_IP: ${{ steps.apply.outputs.public_ip }}
          PG_FQDN: ${{ steps.apply.outputs.pg_fqdn }}
          RUNTIME_SECRET: ${{ steps.apply.outputs.runtime_secret }}
          BACKUP_BUCKET: ${{ steps.apply.outputs.backup_bucket }}
          BACKUP_SECRET: ${{ steps.apply.outputs.backup_secret }}
          RESTORE_FQDN: ${{ steps.apply.outputs.restore_fqdn }}
          TEARDOWN_DELAY: ${{ steps.dispatch_teardown.outputs.teardown_delay_minutes }}
        run: |
          {
            echo "### HOST-001 Stage C bounded apply"
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo "- Owner ceiling: **1,000 RUB total / <=4 hours**"
            echo "- Synthetic-only resources: **LIVE**"
            printf -- '- Public IPv4: `%s`\n' "$PUBLIC_IP"
            printf -- '- PostgreSQL RW FQDN: `%s`\n' "$PG_FQDN"
            printf -- '- Runtime Lockbox secret ID: `%s`\n' "$RUNTIME_SECRET"
            printf -- '- Backup bucket: `%s`\n' "$BACKUP_BUCKET"
            printf -- '- Backup Lockbox secret ID: `%s`\n' "$BACKUP_SECRET"
            printf -- '- Restore PostgreSQL RW FQDN: `%s`\n' "$RESTORE_FQDN"
            echo "- Production data / Render / Neon / MIG-001 / real-data AI / email: **FORBIDDEN**"
            echo "- Encrypted Terraform recovery state: **uploaded with 1-day retention**"
            echo "- Separate cancellation-surviving teardown workflow: **dispatched**"
            echo "- Automatic teardown delay: **$TEARDOWN_DELAY minutes**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final apply result
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          STATE_PRESENT: ${{ steps.apply.outputs.state_present }}
          DISPATCH_OUTCOME: ${{ steps.dispatch_teardown.outcome }}
          FALLBACK_OUTCOME: ${{ steps.fallback_teardown.outcome }}
        run: |
          set -euo pipefail
          if [ "$APPLY_OUTCOME" = "success" ] && [ "$STATE_PRESENT" = "true" ] && [ "$DISPATCH_OUTCOME" = "success" ]; then
            exit 0
          fi
          if [ "$STATE_PRESENT" = "true" ] && [ "$DISPATCH_OUTCOME" != "success" ] && [ "$FALLBACK_OUTCOME" = "success" ]; then
            echo "Stage C apply did not complete a durable handoff; resources were torn down locally."
            exit 1
          fi
          echo "Stage C apply/handoff failed. Inspect Yandex Cloud and the recovery artifact immediately."
          exit 1

      - name: Remove local key/state material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yc-stage-c-key.json" \
            "$RUNNER_TEMP/stage-c-tfstate.enc" \
            "$RUNNER_TEMP/stage-c-apply.tfplan" \
            "$RUNNER_TEMP/stage-c-apply-plan.json" \
            "$RUNNER_TEMP/stage-c-apply-plan.stdout" \
            "$RUNNER_TEMP/stage-c-apply.stdout" \
            "$RUNNER_TEMP/stage-c-fallback-destroy.tfplan" \
            "$RUNNER_TEMP/stage-c-fallback-destroy.json" \
            "$RUNNER_TEMP/stage-c-fallback-destroy.stdout" \
            infra/yandex-cloud/terraform.tfstate \
            infra/yandex-cloud/terraform.tfstate.backup
