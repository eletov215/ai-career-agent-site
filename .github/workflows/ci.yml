name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify production imports
        run: |
          python -c "import flask, requests, cryptography, pypdf"

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Compile Python files
        run: python -m compileall -q app.py services tests scripts

      - name: Run tests
        run: python -m pytest
