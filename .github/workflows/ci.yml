name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ai_bench_live:
        description: "Run billable AI-BENCH-001 comparison against Yandex AI Studio after all CI gates pass"
        required: true
        default: false
        type: boolean
      run_ai_bench_alice_final:
        description: "Run final billable Alice AI LLM-only verification after all CI gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_career_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_career_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATA_DIR: /tmp/ai-career-agent-ci
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_career_agent_test
      TRUDVSEM_SYNC_ENABLED: "0"
      TRUDVSEM_REQUEST_ATTEMPTS: "1"
      TRUDVSEM_RETRY_BACKOFF: "0.1"
      DEBUG_HH: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare test directories
        run: mkdir -p "$DATA_DIR"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify production imports
        run: |
          python -c "import flask, flask_wtf, flask_limiter, requests, cryptography, pypdf, sqlalchemy, alembic, psycopg"

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Compile Python files
        run: >-
          python -m compileall -q
          app.py config.py database.py observability.py security.py domain models repositories operations migrations services tests scripts infra

      - name: Apply test database migrations
        run: python scripts/manage_db.py upgrade

      - name: Verify migration metadata
        run: python -m alembic check

      - name: Verify domain and repository boundaries
        run: >-
          python -m pytest -q
          tests/test_architecture_boundaries.py
          tests/test_database.py
          tests/test_repositories.py
          tests/test_legacy_import.py

      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          python scripts/manage_db.py upgrade
          python scripts/manage_db.py check
          python -m alembic check

      - name: Run PostgreSQL integration test
        run: |
          python -c "import os; assert os.environ.get('POSTGRES_TEST_URL'), 'POSTGRES_TEST_URL is required'"
          python -m pytest tests/test_postgresql_integration.py -q

      - name: Verify SEC-001 security controls
        run: >-
          python -m pytest -q
          tests/test_config.py
          tests/test_template_security.py
          tests/test_university_logo_security.py
          tests/test_rate_limit_proxy.py
          tests/test_routes.py
          tests/test_app_startup_modes.py

      - name: Verify OPS-001 observability controls
        run: >-
          python -m pytest -q
          tests/test_observability.py
          tests/test_backup_restore.py

      - name: Verify SYNC-001 external worker controls
        run: >-
          python -m pytest -q
          tests/test_sync_worker.py
          tests/test_routes.py
          tests/test_config.py
          tests/test_infra_manifests.py

      - name: Verify SYNC-002 incremental freshness and cleanup controls
        run: >-
          python -m pytest -q
          tests/test_sync_incremental.py
          tests/test_sync_worker.py
          tests/test_config.py
          tests/test_infra_manifests.py

      - name: Verify SEARCH-001 vacancy contract and normalization controls
        run: >-
          python -m pytest -q
          tests/test_search_normalization.py
          tests/test_providers.py
          tests/test_vacancy_store.py
          tests/test_search_filters.py
          tests/test_vacancy_presenter.py
          tests/test_repositories.py

      - name: Verify SEARCH-002 cross-source deduplication controls
        run: >-
          python -m pytest -q
          tests/test_search_deduplication.py
          tests/test_routes.py
          tests/test_vacancy_presenter.py
          tests/test_vacancy_store.py
          tests/test_repositories.py

      - name: Verify SEARCH-003 stable pagination and totals controls
        run: >-
          python -m pytest -q
          tests/test_search_pagination.py
          tests/test_routes.py
          tests/test_observability.py
          tests/test_config.py
          tests/test_database.py
          tests/test_postgresql_integration.py

      - name: Verify SEARCH-004 canonical route and source-state controls
        run: >-
          python -m pytest -q
          tests/test_source_status.py
          tests/test_routes.py
          tests/test_template_security.py
          tests/test_search_pagination.py

      - name: Verify SEARCH-005 admin source health controls
        run: >-
          python -m pytest -q
          tests/test_search005_migration.py
          tests/test_source_health_service.py
          tests/test_search005_route_registration.py
          tests/test_search005_routes.py
          tests/test_search005_security.py
          tests/test_config.py
          tests/test_observability.py
          tests/test_routes.py
          tests/test_template_security.py
          tests/test_architecture_boundaries.py
          tests/test_postgresql_integration.py

      - name: Verify AUTH-001 first-party account controls
        run: >-
          python -m pytest -q
          tests/test_auth_migration.py
          tests/test_passwords.py
          tests/test_auth_service.py
          tests/test_auth_routes.py
          tests/test_email_delivery.py
          tests/test_config.py
          tests/test_repositories.py
          tests/test_template_security.py
          tests/test_postgresql_integration.py

      - name: Verify AUTH-002 first-party OAuth identity ownership controls
        run: >-
          python -m pytest -q
          tests/test_auth002_migration.py
          tests/test_oauth_identity_service.py
          tests/test_auth002_routes.py
          tests/test_auth_routes.py
          tests/test_routes.py
          tests/test_repositories.py
          tests/test_template_security.py
          tests/test_postgresql_integration.py

      - name: Verify PROF-001 structured career profile controls
        run: >-
          python -m pytest -q
          tests/test_prof001_migration.py
          tests/test_profile_service.py
          tests/test_profile_routes.py
          tests/test_auth_routes.py
          tests/test_repositories.py
          tests/test_template_security.py
          tests/test_document_structure.py
          tests/test_postgresql_integration.py

      - name: Verify PROF-002 resume import review controls
        run: >-
          python -m pytest -q
          tests/test_prof002_migration.py
          tests/test_resume_import_service.py
          tests/test_resume_import_routes.py
          tests/test_resume_parser.py
          tests/test_profile_service.py
          tests/test_profile_routes.py
          tests/test_template_security.py
          tests/test_postgresql_integration.py

      - name: Verify PROF-003 server resume draft and version controls
        run: >-
          python -m pytest -q
          tests/test_prof003_migration.py
          tests/test_resume_draft_service.py
          tests/test_resume_draft_routes.py
          tests/test_repositories.py
          tests/test_profile_service.py
          tests/test_auth_routes.py
          tests/test_template_security.py
          tests/test_architecture_boundaries.py
          tests/test_postgresql_integration.py

      - name: Verify PRIV-001 privacy export deletion and retention controls
        run: >-
          python -m pytest -q
          tests/test_priv001_migration.py
          tests/test_privacy_service.py
          tests/test_privacy_routes.py
          tests/test_auth_service.py
          tests/test_auth_routes.py
          tests/test_auth002_routes.py
          tests/test_profile_service.py
          tests/test_resume_draft_service.py
          tests/test_backup_restore.py
          tests/test_config.py
          tests/test_infra_manifests.py
          tests/test_architecture_boundaries.py
          tests/test_postgresql_integration.py

      - name: Verify PostgreSQL encrypted backup and restore
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
          RESTORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_career_agent_restore
          BACKUP_ENCRYPTION_KEY: yPWPkxw3j4ZWDVBQ-i3kryGBFjd-5Bjg2tDjCNUMciw=
          BACKUP_DIR: /tmp/ai-career-agent-backups
        run: |
          set -euo pipefail
          postgres_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17-alpine/ {print $1; exit}')
          test -n "$postgres_container"
          printf '%s' "$postgres_container" > /tmp/aca-postgres-container-id

          cat > /tmp/aca-pg-dump <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container=$(cat /tmp/aca-postgres-container-id)
          exec docker exec -i \
            -e PGHOST="${PGHOST:-127.0.0.1}" \
            -e PGPORT="${PGPORT:-5432}" \
            -e PGUSER="${PGUSER:-postgres}" \
            -e PGPASSWORD="${PGPASSWORD:-}" \
            -e PGDATABASE="${PGDATABASE:-}" \
            "$container" pg_dump "$@"
          SH

          cat > /tmp/aca-pg-restore <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container=$(cat /tmp/aca-postgres-container-id)
          exec docker exec -i \
            -e PGHOST="${PGHOST:-127.0.0.1}" \
            -e PGPORT="${PGPORT:-5432}" \
            -e PGUSER="${PGUSER:-postgres}" \
            -e PGPASSWORD="${PGPASSWORD:-}" \
            -e PGDATABASE="${PGDATABASE:-}" \
            "$container" pg_restore "$@"
          SH

          chmod +x /tmp/aca-pg-dump /tmp/aca-pg-restore
          export PG_DUMP_BIN=/tmp/aca-pg-dump
          export PG_RESTORE_BIN=/tmp/aca-pg-restore

          docker exec -e PGPASSWORD=postgres "$postgres_container" \
            createdb -U postgres ai_career_agent_restore

          python scripts/backup_database.py \
            --output-dir "$BACKUP_DIR" \
            --name ops-ci.dump
          python scripts/verify_backup.py \
            --backup "$BACKUP_DIR/ops-ci.dump.enc"
          python scripts/restore_database.py \
            --backup "$BACKUP_DIR/ops-ci.dump.enc"

      - name: Verify INFRA-001 manifests, probe and document structure
        run: >-
          python -m pytest -q
          tests/test_infra_probe.py
          tests/test_infra_manifests.py
          tests/test_document_structure.py
          && python scripts/infra_manifest_check.py
          && python scripts/check_document_structure.py

      - name: Validate INFRA-001 Docker Compose configuration
        run: docker compose --env-file infra/vps/compose.test.env config --quiet

      - name: Build INFRA-001 container targets
        run: |
          docker build --target runtime --tag ai-career-agent:infra-ci .
          docker build --target ops --tag ai-career-agent-ops:infra-ci .

      - name: Smoke-test INFRA-001 runtime image
        env:
          ENV_FILE: infra/vps/compose.test.env
          BASE_URL: http://127.0.0.1:18000
          REPORT_DIR: /tmp/ai-career-agent-infra-reports
        run: bash scripts/infra_container_smoke.sh

      - name: Run tests
        run: python -m pytest -ra

  ai-bench-001:
    name: AI-BENCH-001 package gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate deterministic benchmark package
        run: python scripts/check_ai_bench_package.py

      - name: Run AI-BENCH-001 unit tests
        run: python -m unittest discover -s tests -p 'test_ai_bench_*.py' -v

  ai-bench-yandex-live:
    name: AI-BENCH-001 Live Yandex
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai_bench_live == true }}
    needs:
      - tests
      - ai-bench-001
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ai-bench-001-yandex-live
      cancel-in-progress: false
    env:
      AI_BENCH_YANDEX_API_KEY: ${{ secrets.AI_BENCH_YANDEX_API_KEY }}
      AI_BENCH_YANDEX_FOLDER_ID: ${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}
      AI_BENCH_YANDEX_ALICE_LLM_MODEL: gpt://${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}/aliceai-llm/latest
      AI_BENCH_YANDEX_ALICE_LLM_FLASH_MODEL: gpt://${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}/aliceai-llm-flash/latest
      AI_BENCH_YANDEX_YGPT51_MODEL: gpt://${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}/yandexgpt-5.1/latest

      AI_BENCH_OUTPUT_DIR: /tmp/ai-bench-yandex-live
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          test -n "$AI_BENCH_YANDEX_API_KEY" || { echo "AI_BENCH_YANDEX_API_KEY is missing"; exit 1; }
          test -n "$AI_BENCH_YANDEX_FOLDER_ID" || { echo "AI_BENCH_YANDEX_FOLDER_ID is missing"; exit 1; }

      - name: Validate deterministic benchmark package
        run: python scripts/check_ai_bench_package.py

      - name: Validate Yandex live configuration
        run: >-
          python -m evals.ai_bench validate
          --config evals/config/yandex-live.json
          --check-credentials

      - name: Run live comparative benchmark
        run: >-
          python -m evals.ai_bench run
          --config evals/config/yandex-live.json
          --output-dir "$AI_BENCH_OUTPUT_DIR"

      - name: Add benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f "$AI_BENCH_OUTPUT_DIR/run.json" ]; then
            python - "$AI_BENCH_OUTPUT_DIR/run.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          print("# AI-BENCH-001 Yandex live result")
          print()
          print(f"Machine status: **{run.get('status')}**")
          print(f"Benchmark contract: **{run.get('benchmark_version')} / grounded-v2.3**")
          print()
          print("| Provider | Passed | Errors | Retries | Quality | Grounding | Language violations | Scenario violations | Scenario repairs | Marker cleanup | Clean text | Match consistency | Safety violations | Avg derived match | p50 ms | p95 ms | Est. cost USD |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
          for provider in run.get("providers", []):
              s = provider.get("summary") or {}
              safety = sum(int(s.get(key) or 0) for key in (
                  "forbidden_claim_count",
                  "unsupported_number_count",
                  "user_facing_technical_token_count",
                  "claim_evidence_violation_count",
                  "unsupported_impact_claim_count",
                  "language_consistency_violation_count",
                  "scenario_provenance_violation_count",
                  "match_consistency_violation_count",
              ))
              print(
                  f"| {provider.get('id')} | {s.get('passed_count')}/{s.get('case_count')} | {s.get('error_count')} | {s.get('retry_count')} | "
                  f"{s.get('mean_quality_score')} | {s.get('mean_grounding_score')} | {s.get('language_consistency_violation_count')} | "
                  f"{s.get('scenario_provenance_violation_count')} | {s.get('scenario_provenance_repair_count')} | {s.get('user_facing_marker_cleanup_count')} | {s.get('mean_user_facing_cleanliness')} | "
                  f"{s.get('mean_match_consistency_score')} | {safety} | {s.get('mean_deterministic_match_score')} | "
                  f"{s.get('p50_latency_ms')} | {s.get('p95_latency_ms')} | {s.get('estimated_cost_usd')} |"
              )
          print()
          print("Numeric vacancy match is derived by deterministic benchmark logic; models do not author match_score.")
          print("Language consistency, scenario provenance and expanded impact-safety are hard-gated before manual review; simple decorated evidence markers are deterministically removed from display text and audited.")
          print("At most one bounded retry is allowed per live request and retry evidence is retained.")
          print("Manual writing-quality rubric remains pending; no provider decision is made by this workflow.")
          PY
          else
            echo "# AI-BENCH-001 Yandex live result" >> "$GITHUB_STEP_SUMMARY"
            echo "run.json was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-bench-001-yandex-live-${{ github.run_id }}
          path: ${{ env.AI_BENCH_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Verify live transport completed without provider errors
        if: always()
        run: python scripts/check_ai_bench_live_result.py "$AI_BENCH_OUTPUT_DIR/run.json"

  ai-bench-yandex-alice-final:
    name: AI-BENCH-001 Alice Final
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai_bench_alice_final == true }}
    needs:
      - tests
      - ai-bench-001
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-bench-001-yandex-alice-final
      cancel-in-progress: false
    env:
      AI_BENCH_YANDEX_API_KEY: ${{ secrets.AI_BENCH_YANDEX_API_KEY }}
      AI_BENCH_YANDEX_FOLDER_ID: ${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}
      AI_BENCH_YANDEX_ALICE_LLM_MODEL: gpt://${{ secrets.AI_BENCH_YANDEX_FOLDER_ID }}/aliceai-llm/latest
      AI_BENCH_ALICE_FINAL_OUTPUT_DIR: /tmp/ai-bench-yandex-alice-final
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          test -n "$AI_BENCH_YANDEX_API_KEY" || { echo "AI_BENCH_YANDEX_API_KEY is missing"; exit 1; }
          test -n "$AI_BENCH_YANDEX_FOLDER_ID" || { echo "AI_BENCH_YANDEX_FOLDER_ID is missing"; exit 1; }

      - name: Validate deterministic benchmark package
        run: python scripts/check_ai_bench_package.py

      - name: Validate Alice final configuration
        run: >-
          python -m evals.ai_bench validate
          --config evals/config/yandex-alice-final.json
          --check-credentials

      - name: Run Alice final machine verification
        run: >-
          python -m evals.ai_bench run
          --config evals/config/yandex-alice-final.json
          --output-dir "$AI_BENCH_ALICE_FINAL_OUTPUT_DIR"

      - name: Add Alice final summary
        if: always()
        shell: bash
        run: |
          if [ -f "$AI_BENCH_ALICE_FINAL_OUTPUT_DIR/run.json" ]; then
            python - "$AI_BENCH_ALICE_FINAL_OUTPUT_DIR/run.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          print("# AI-BENCH-001 Alice final verification")
          print()
          print(f"Machine status: **{run.get('status')}**")
          print(f"Dataset: **{(run.get('dataset') or {}).get('version')} / grounded-v2.3**")
          print()
          provider = (run.get("providers") or [{}])[0]
          s = provider.get("summary") or {}
          print("| Provider | Passed | Errors | Retries | Quality | Grounding | Impact | Scenario | Scenario repairs | Clean text | p50 ms | p95 ms | Est. cost USD |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
          print(
              f"| {provider.get('id')} | {s.get('passed_count')}/{s.get('case_count')} | {s.get('error_count')} | {s.get('retry_count')} | "
              f"{s.get('mean_quality_score')} | {s.get('mean_grounding_score')} | {s.get('unsupported_impact_claim_count')} | "
              f"{s.get('scenario_provenance_violation_count')} | {s.get('scenario_provenance_repair_count')} | {s.get('mean_user_facing_cleanliness')} | "
              f"{s.get('p50_latency_ms')} | {s.get('p95_latency_ms')} | {s.get('estimated_cost_usd')} |"
          )
          print()
          print("This job verifies Alice AI LLM machine safety only. A named human writing-quality review is still mandatory before AI-BENCH-001 closure.")
          PY
          else
            echo "# AI-BENCH-001 Alice final verification" >> "$GITHUB_STEP_SUMMARY"
            echo "run.json was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized Alice final evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-bench-001-yandex-alice-final-${{ github.run_id }}
          path: ${{ env.AI_BENCH_ALICE_FINAL_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Alice final machine safety gate
        if: always()
        run: python scripts/check_ai_bench_alice_final_result.py "$AI_BENCH_ALICE_FINAL_OUTPUT_DIR/run.json"

