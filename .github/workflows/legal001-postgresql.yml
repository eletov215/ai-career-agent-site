name: LEGAL-001 PostgreSQL verification

"on":
  push:
    paths:
      - operations/backup.py
      - repositories/consent.py
      - services/consent.py
      - migrations/versions/20260922_0021_legal_consent.py
      - tests/test_legal001_postgresql.py
      - scripts/check_legal001_package.py
      - .github/workflows/legal001-postgresql.yml
      - requirements*.txt
  pull_request:
    paths:
      - operations/backup.py
      - repositories/consent.py
      - services/consent.py
      - migrations/versions/20260922_0021_legal_consent.py
      - tests/test_legal001_postgresql.py
      - scripts/check_legal001_package.py
      - .github/workflows/legal001-postgresql.yml
      - requirements*.txt

permissions:
  contents: read

jobs:
  legal001-postgresql:
    name: T-05/T-06 disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_career_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_career_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_career_agent_test
      TRUDVSEM_SYNC_ENABLED: "0"
      TRUDVSEM_REQUEST_ATTEMPTS: "1"
      TRUDVSEM_RETRY_BACKOFF: "0.1"
      DEBUG_HH: "0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare isolated PostgreSQL client wrappers
        shell: bash
        run: |
          set -euo pipefail
          postgres_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17-alpine/ {print $1; exit}')
          test -n "$postgres_container"
          printf '%s' "$postgres_container" > /tmp/aca-legal001-postgres-container-id

          cat > /tmp/aca-legal001-pg-dump <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container=$(cat /tmp/aca-legal001-postgres-container-id)
          exec docker exec -i             -e PGHOST="${PGHOST:-127.0.0.1}"             -e PGPORT="${PGPORT:-5432}"             -e PGUSER="${PGUSER:-postgres}"             -e PGPASSWORD="${PGPASSWORD:-}"             -e PGDATABASE="${PGDATABASE:-}"             "$container" pg_dump "$@"
          SH

          cat > /tmp/aca-legal001-pg-restore <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container=$(cat /tmp/aca-legal001-postgres-container-id)
          exec docker exec -i             -e PGHOST="${PGHOST:-127.0.0.1}"             -e PGPORT="${PGPORT:-5432}"             -e PGUSER="${PGUSER:-postgres}"             -e PGPASSWORD="${PGPASSWORD:-}"             -e PGDATABASE="${PGDATABASE:-}"             "$container" pg_restore "$@"
          SH

          chmod +x /tmp/aca-legal001-pg-dump /tmp/aca-legal001-pg-restore
          echo "PG_DUMP_BIN=/tmp/aca-legal001-pg-dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=/tmp/aca-legal001-pg-restore" >> "$GITHUB_ENV"

      - name: T-05 LEGAL-001 migration/history/cascade/backup/downgrade
        run: python -m pytest -q tests/test_legal001_postgresql.py

      - name: Migration tool checks on disposable PostgreSQL
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          python scripts/manage_db.py upgrade
          python scripts/manage_db.py check
          python -m alembic check
          python -m pytest -q tests/test_legal001_migration.py

      - name: T-06 PostgreSQL regressions
        run: |
          python -m pytest -q tests/test_postgresql_integration.py
          python -m pytest -q tests/test_ai001_migration.py
          python -m pytest -q tests/test_ai002_migration.py
          python -m pytest -q tests/test_ai003_migration.py
          python -m pytest -q tests/test_ai004_migration.py
          python -m pytest -q tests/test_job001_migration.py
          python -m pytest -q tests/test_ai005_migration.py
          python -m pytest -q tests/test_ai005_live_postgresql.py
