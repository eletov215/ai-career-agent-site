name: AI004-M04B isolated candidate QA (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - "models/user_match.py"
      - "models/__init__.py"
      - "repositories/user_match.py"
      - "repositories/privacy.py"
      - "services/privacy.py"
      - "operations/backup.py"
      - "migrations/versions/20261009_0024_user_matching_cache.py"
      - "database.py"
      - "tests/test_ai004_m04b_*.py"
      - ".github/workflows/ai004-m04b-candidate.yml"

permissions:
  contents: read

jobs:
  integrity-and-sqlite:
    name: M04B successor SHA and SQLite (Docker-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATA_DIR: /tmp/aca-m04b-sqlite-only
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned Python test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify M04B exact successor and history without network dispatch
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.ai004_m04b_successor import validate_successor
          data = validate_successor(Path.cwd())
          assert data["schema_from"] == "20261002_0023"
          assert data["schema_to"] == "20261009_0024"
          assert data["public_real_data_enabled"] is False
          assert data["production_migration"] == "NOT_RUN"
          assert data["provider_calls"] == 0
          PY
      - name: Test exact SHA tampering, isolated SQLite and historical guards
        run: >-
          python -m pytest -q
          tests/test_ai004_m04b_successor.py
          tests/test_ai004_m04b_migration.py
          tests/test_ai004_m04b_storage.py
          tests/test_ai004_m04b_restore.py
          tests/test_job003_migration.py
          tests/test_priv001_migration.py
          tests/test_legal001_migration.py
          tests/test_ai005_site_qa_package.py
          tests/test_job002_package.py
          tests/test_job003_package.py
          tests/test_job004_package.py
          tests/test_legal001_package.py
  disposable-db-only:
    name: M04B SQLite and isolated PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: candidate
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: ai004_m04b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidate -d ai004_m04b_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://candidate:disposable-test-only@localhost:5432/ai004_m04b_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate exact M04B successor hashes and safety metadata
        run: |
          sha256sum .github/workflows/host001-yandex-cloud.yml
          python - <<'PY'
          from pathlib import Path
          from scripts.ai004_m04b_successor import validate_successor
          x = validate_successor(Path.cwd())
          assert x["production_migration"] == "NOT_RUN"
          assert x["provider_calls"] == 0
          print("M04B successor: SHA256 and static safety gate PASS")
          PY
      - name: Verify M04B migration and owner-scoped storage using synthetic fixtures only
        run: python -m pytest -q tests/test_ai004_m04b_migration.py tests/test_ai004_m04b_storage.py tests/test_ai004_m04b_restore.py tests/test_ai004_m04b_successor.py
      - name: Historical AI004, privacy, backup and JOB001 regression suite
        run: >-
          python -m pytest -q
          tests/test_ai004_scoring.py
          tests/test_ai004_service.py
          tests/test_ai004_migration.py
          tests/test_privacy_service.py
          tests/test_backup_restore.py
          tests/test_job001_migration.py
      - name: Prepare PostgreSQL 18 client wrappers inside disposable GitHub runner
        run: |
          mkdir -p "$RUNNER_TEMP/ai004-pg18"
          cat > "$RUNNER_TEMP/ai004-pg18/pg_dump" <<'SH'
          #!/bin/sh
          exec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:18 pg_dump "$@"
          SH
          cat > "$RUNNER_TEMP/ai004-pg18/pg_restore" <<'SH'
          #!/bin/sh
          exec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE postgres:18 pg_restore "$@"
          SH
          chmod 700 "$RUNNER_TEMP/ai004-pg18/pg_dump" "$RUNNER_TEMP/ai004-pg18/pg_restore"
      - name: PostgreSQL 18 encrypted backup/restore with populated synthetic matching data
        env:
          PG_DUMP_BIN: ${{ runner.temp }}/ai004-pg18/pg_dump
          PG_RESTORE_BIN: ${{ runner.temp }}/ai004-pg18/pg_restore
        run: python -m pytest -q tests/test_ai004_m04b_pg18_restore.py
      - name: Assert no real-data AI release
        run: python -c "from domain.ai import REAL_DATA_SUPPORTED; assert REAL_DATA_SUPPORTED is False"
