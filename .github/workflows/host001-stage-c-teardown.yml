name: HOST-001 Stage C recovery teardown

"on":
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "AUTO_TEARDOWN_STAGE_C_SYNTHETIC (internal) or DESTROY_STAGE_C_SYNTHETIC_1000_RUB (manual recovery)."
        required: true
        type: string
      source_sha:
        description: "Exact commit SHA used by the Stage C apply run."
        required: true
        type: string
      source_run_id:
        description: "GitHub Actions run ID of the Stage C apply workflow."
        required: true
        type: string
      hold_minutes:
        description: "Successful-apply field window. Automatic path allows 15-90; manual recovery must use 0."
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: host001-stage-c-recovery-teardown
  cancel-in-progress: false

jobs:
  teardown:
    name: Recover remote state and tear down reviewed Stage C resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 225
    environment: stage-c-yandex

    env:
      TF_VAR_app_zone: ru-central1-d
      TF_VAR_db_secondary_zone: ru-central1-b
      TF_VAR_postgresql_host_profile: single
      TF_VAR_vm_cores: "2"
      TF_VAR_vm_memory_gb: "4"
      TF_VAR_vm_disk_gb: "40"
      TF_VAR_postgresql_resource_preset_id: s3-c2-m8
      TF_VAR_postgresql_disk_type_id: network-ssd
      TF_VAR_postgresql_disk_size_gb: "20"
      TF_VAR_postgresql_backup_retain_days: "7"
      TF_VAR_field_test_resources_enabled: "true"
      TF_VAR_foundation_deletion_protection: "false"
      TF_VAR_field_test_restore_resource_preset_id: s3-c2-m8
      TF_VAR_field_test_restore_disk_size_gb: "20"
      TF_VAR_field_test_bucket_max_size_bytes: "1073741824"

    steps:
      - name: Validate teardown authorization and recovery coordinates
        shell: bash
        env:
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          case "$STAGE_C_ACKNOWLEDGEMENT" in
            AUTO_TEARDOWN_STAGE_C_SYNTHETIC|DESTROY_STAGE_C_SYNTHETIC_1000_RUB) ;;
            *)
              echo "Refusing teardown: invalid acknowledgement."
              exit 1
              ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be an exact 40-character commit SHA."
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "source_run_id must be numeric."
            exit 1
          }
          [[ "$HOLD_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "hold_minutes must be an integer."
            exit 1
          }
          test "$HOLD_MINUTES" -ge 0
          test "$HOLD_MINUTES" -le 90
          if [ "$STAGE_C_ACKNOWLEDGEMENT" = "AUTO_TEARDOWN_STAGE_C_SYNTHETIC" ]; then
            test "$HOLD_MINUTES" -ge 15
          else
            test "$HOLD_MINUTES" -eq 0
          fi

      - name: Validate source apply run identity before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/source-apply-run.json"
          rm -f "$run_file"

          for attempt in $(seq 1 5); do
            if curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"               -o "$run_file"; then
              if test -s "$run_file"; then
                break
              fi
            fi
            echo "Source apply run lookup attempt $attempt failed; retrying."
            rm -f "$run_file"
            sleep 3
          done

          test -s "$run_file" || {
            echo "Unable to validate source apply run identity."
            exit 1
          }

          source_started="$(
            python - "$run_file" "$SOURCE_SHA" "$SOURCE_RUN_ID" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          path, expected_sha, expected_run_id, expected_repo = sys.argv[1:]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)

          checks = (
              str(data.get("id")) == expected_run_id,
              data.get("event") == "workflow_dispatch",
              data.get("head_branch") == "main",
              data.get("head_sha") == expected_sha,
              (data.get("path") or "").split("@", 1)[0] == ".github/workflows/host001-stage-c-apply.yml",
              data.get("repository", {}).get("full_name") == expected_repo,
          )
          if not all(checks):
              raise SystemExit(
                  "Source run identity does not match the reviewed Stage C apply workflow on main"
              )

          started = data.get("run_started_at") or data.get("created_at")
          if not started:
              raise SystemExit("Source run has no start timestamp")
          print(started)
          PY
          )"

          source_initial_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status") or "")' "$run_file")"
          echo "SOURCE_APPLY_RUN_STARTED_AT=$source_started" >> "$GITHUB_ENV"
          echo "SOURCE_APPLY_RUN_INITIAL_STATUS=$source_initial_status" >> "$GITHUB_ENV"
          rm -f "$run_file"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify exact recovery commit boundary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"

      - name: Materialize Yandex service-account key outside repository
        shell: bash
        env:
          YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" || {
            echo "Missing protected Stage C service-account key."
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/yc-stage-c-key.json"
          printf '%s' "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" > "$key_file"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "yc-stage-c-key.json")
          data = json.load(open(path, encoding="utf-8"))
          required = {"id", "service_account_id", "private_key"}
          if not required.issubset(data):
              raise SystemExit("Invalid Yandex service-account key structure")
          PY
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Initialize durable Yandex Object Storage backend
        shell: bash
        env:
          TFSTATE_BUCKET: ${{ secrets.YC_STAGE_C_TFSTATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STAGE_C_TFSTATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STAGE_C_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$TFSTATE_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          terraform -chdir=infra/yandex-cloud init             -reconfigure             -input=false             -backend-config="bucket=$TFSTATE_BUCKET"
          terraform -chdir=infra/yandex-cloud validate

      - name: Wait for source apply result and bounded successful field window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
          SOURCE_RUN_STARTED_AT: ${{ env.SOURCE_APPLY_RUN_STARTED_AT }}
          SOURCE_RUN_INITIAL_STATUS: ${{ env.SOURCE_APPLY_RUN_INITIAL_STATUS }}
        run: |
          set -euo pipefail

          remaining=0
          if [ "$STAGE_C_ACKNOWLEDGEMENT" = "AUTO_TEARDOWN_STAGE_C_SYNTHETIC" ]; then
            completed=0
            conclusion=""
            run_file="$RUNNER_TEMP/source-apply-run-poll.json"

            for attempt in $(seq 1 120); do
              rm -f "$run_file"
              if ! curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer $GH_TOKEN"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"                 -o "$run_file"; then
                echo "Source apply status lookup attempt $attempt failed; retrying."
                sleep 30
                continue
              fi

              if ! parsed="$(
                python - "$run_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
              print((data.get("status") or "") + "|" + (data.get("conclusion") or ""))
          except Exception:
              raise SystemExit(1)
          PY
              )"; then
                echo "Source apply status response could not be parsed; retrying."
                sleep 30
                continue
              fi

              status="$(printf '%s' "$parsed" | cut -d '|' -f 1)"
              conclusion="$(printf '%s' "$parsed" | cut -d '|' -f 2-)"
              if [ "$status" = "completed" ]; then
                completed=1
                echo "SOURCE_RUN_TERMINAL_CONFIRMED=1" >> "$GITHUB_ENV"
                break
              fi
              sleep 30
            done

            rm -f "$run_file"

            if [ "$completed" -eq 1 ]; then
              if [ "$conclusion" = "success" ]; then
                requested_seconds=$((HOLD_MINUTES * 60))
                destroy_start_deadline="$(
                  python - "$SOURCE_RUN_STARTED_AT" <<'PY'
          from datetime import datetime
          import sys

          started = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          # Begin teardown by +150 minutes, reserving 90 minutes
          # inside the owner-approved four-hour resource-lifetime boundary.
          print(int(started.timestamp()) + 150 * 60)
          PY
                )"
                now_epoch="$(date -u +%s)"
                available_seconds=$((destroy_start_deadline - now_epoch))
                if [ "$available_seconds" -lt 0 ]; then
                  available_seconds=0
                fi

                if [ "$requested_seconds" -gt "$available_seconds" ]; then
                  echo "Field window shortened to preserve the 90-minute teardown reserve."
                  remaining="$available_seconds"
                else
                  remaining="$requested_seconds"
                fi
              else
                echo "Source apply concluded $conclusion; skipping field window and tearing down immediately."
              fi
            else
              echo "Unable to confirm source completion after retries; failing safe to immediate teardown."
            fi
          else
            test "$SOURCE_RUN_INITIAL_STATUS" = "completed" || {
              echo "Manual recovery requires the source Stage C apply run to be completed."
              exit 1
            }
            echo "SOURCE_RUN_TERMINAL_CONFIRMED=1" >> "$GITHUB_ENV"
          fi
          while [ "$remaining" -gt 0 ]; do
            chunk=900
            if [ "$remaining" -lt "$chunk" ]; then
              chunk="$remaining"
            fi
            echo "Stage C synthetic field window: $(( (remaining + 59) / 60 )) minute(s) remaining."
            sleep "$chunk"
            remaining=$((remaining - chunk))
          done

      - name: Destroy reviewed Stage C resources from remote state
        id: destroy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STAGE_C_TFSTATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STAGE_C_TFSTATE_SECRET_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_STAGE_C_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_STAGE_C_FOLDER_ID }}
          TF_VAR_admin_cidr: ${{ secrets.YC_STAGE_C_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.YC_STAGE_C_SSH_PUBLIC_KEY }}
          TF_VAR_postgresql_app_password: ${{ secrets.YC_STAGE_C_POSTGRES_PASSWORD }}
          TF_VAR_field_test_restore_password: ${{ secrets.YC_STAGE_C_RESTORE_PASSWORD }}
        run: |
          set -euo pipefail
          destroy_plan="$RUNNER_TEMP/stage-c-destroy.tfplan"
          destroy_json="$RUNNER_TEMP/stage-c-destroy-plan.json"
          destroy_log="$RUNNER_TEMP/stage-c-destroy.stdout"

          destroy_plan_deadline="$(
            python - "$SOURCE_RUN_STARTED_AT" <<'PY'
          from datetime import datetime
          import sys

          started = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          print(int(started.timestamp()) + 170 * 60)
          PY
          )"
          destroy_apply_deadline="$(
            python - "$SOURCE_RUN_STARTED_AT" <<'PY'
          from datetime import datetime
          import sys

          started = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          # Stop provider deletion attempts by +225 minutes, leaving 15 minutes
          # inside the owner-approved four-hour resource-lifetime boundary.
          print(int(started.timestamp()) + 225 * 60)
          PY
          )"

          plan_code=1
          stale_lock_recovered=0
          for attempt in $(seq 1 3); do
            now_epoch="$(date -u +%s)"
            plan_budget=$((destroy_plan_deadline - now_epoch))
            test "$plan_budget" -gt 0 || {
              echo "Absolute Stage C destroy-plan deadline reached; refusing to extend the lifecycle window."
              exit 1
            }
            attempt_budget="$plan_budget"
            if [ "$attempt_budget" -gt 600 ]; then
              attempt_budget=600
            fi

            set +e
            timeout --signal=INT --kill-after=30s "${attempt_budget}s" \
              terraform -chdir=infra/yandex-cloud plan \
                -destroy \
                -input=false \
                -lock-timeout=2m \
                -no-color \
                -detailed-exitcode \
                -out="$destroy_plan" >"$destroy_log" 2>&1
            plan_code=$?
            set -e

            if [ "$plan_code" -eq 0 ] || [ "$plan_code" -eq 2 ]; then
              break
            fi

            if grep -q "Error acquiring the state lock" "$destroy_log"; then
              lock_id="$(awk '/Lock Info:/ {in_lock=1; next} in_lock && $1 == "ID:" {print $2; exit}' "$destroy_log")"
              if [ -n "$lock_id" ] && [ "${SOURCE_RUN_TERMINAL_CONFIRMED:-0}" = "1" ] && [ "$stale_lock_recovered" -eq 0 ]; then
                active_runs_file="$RUNNER_TEMP/stage-c-active-apply-runs.json"
                rm -f "$active_runs_file"
                if ! curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10 \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/host001-stage-c-apply.yml/runs?event=workflow_dispatch&per_page=100" \
                  -o "$active_runs_file"; then
                  echo "Cannot prove the stale lock belongs to a terminal lifecycle; refusing force-unlock."
                  exit 1
                fi

                python - "$active_runs_file" "$SOURCE_RUN_ID" <<'PY'
          import json
          import sys

          path, source_run_id = sys.argv[1:]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)

          active = [
              run
              for run in data.get("workflow_runs", [])
              if str(run.get("id")) != source_run_id
              and run.get("status") != "completed"
          ]
          if active:
              ids = ",".join(str(run.get("id")) for run in active)
              raise SystemExit(
                  "Another Stage C apply run is active or queued; refusing force-unlock: " + ids
              )
          PY
                rm -f "$active_runs_file"

                echo "Stale Terraform lock detected after the exact source apply run became terminal and no other apply run is active; performing one guarded force-unlock."
                timeout --signal=INT --kill-after=10s 60s terraform -chdir=infra/yandex-cloud force-unlock -force "$lock_id" >"$RUNNER_TEMP/stage-c-force-unlock.stdout" 2>&1 || {
                  echo "Guarded Terraform force-unlock failed."
                  exit 1
                }
                stale_lock_recovered=1
                continue
              fi
            fi

            echo "Terraform destroy plan attempt $attempt failed; retrying without bypassing an unverified lock."
            sleep 30
          done
          if [ "$plan_code" -eq 0 ]; then
            echo "No Stage C resources remain in remote Terraform state."
            echo "had_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$plan_code" -ne 2 ]; then
            echo "Terraform destroy plan failed after retries."
            exit "$plan_code"
          fi

          terraform -chdir=infra/yandex-cloud show -json "$destroy_plan" > "$destroy_json"

          jq -r '
            .resource_changes[]?
            | [.address, (.change.actions | join(","))]
            | @tsv
          ' "$destroy_json" | sort

          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "delete" or . == "read" or . == "no-op")
            )
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains an unexpected non-delete action."
            exit 1
          }

          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains a resource outside the reviewed Stage C allowlist."
            exit 1
          }

          now_epoch="$(date -u +%s)"
          apply_budget=$((destroy_apply_deadline - now_epoch))
          test "$apply_budget" -gt 0 || {
            echo "Absolute Stage C destroy deadline reached before destroy apply."
            exit 1
          }

          timeout --signal=INT --kill-after=30s "${apply_budget}s" \
            terraform -chdir=infra/yandex-cloud apply \
              -auto-approve \
              -input=false \
              -lock-timeout=10m \
              -no-color \
              "$destroy_plan" >"$destroy_log" 2>&1

          managed_count="$(terraform -chdir=infra/yandex-cloud state list 2>/dev/null | grep -vc '^data\.' || true)"
          test "$managed_count" -eq 0 || {
            echo "Managed resources remain in remote Terraform state after teardown."
            exit 1
          }

          echo "had_changes=true" >> "$GITHUB_OUTPUT"
          echo "Stage C teardown verified: no managed Terraform resources remain."

      - name: Record verified teardown
        if: success()
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HAD_CHANGES: ${{ steps.destroy.outputs.had_changes }}
        run: |
          {
            echo "### HOST-001 Stage C recovery teardown"
            echo
            printf -- '- Apply run ID: `%s`\n' "$SOURCE_RUN_ID"
            printf -- '- Apply commit: `%s`\n' "$SOURCE_SHA"
            echo "- Remote Terraform state backend: **Yandex Object Storage with lockfile**"
            echo "- Destroy provider deadline: **<=225 minutes from source apply start (15-minute owner-boundary reserve)**"
            echo "- Terraform managed resources after teardown: **0**"
            echo "- Destroy changes applied: **$HAD_CHANGES**"
            echo "- Production data / Render / Neon / MIG-001 / real-data AI / email: **NOT TOUCHED**"
            echo "- Final manual cleanup: revoke the temporary backend static access key and delete the dedicated state bucket after evidence is captured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local recovery material
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/yc-stage-c-key.json" \
            "$RUNNER_TEMP/source-apply-run.json" \
            "$RUNNER_TEMP/source-apply-run-poll.json" \
            "$RUNNER_TEMP/stage-c-destroy.tfplan" \
            "$RUNNER_TEMP/stage-c-destroy-plan.json" \
            "$RUNNER_TEMP/stage-c-destroy.stdout" \
            "$RUNNER_TEMP/stage-c-force-unlock.stdout" \
            "$RUNNER_TEMP/stage-c-active-apply-runs.json" \
            infra/yandex-cloud/.terraform
