name: HOST-001 Stage C recovery teardown

"on":
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "AUTO_TEARDOWN_STAGE_C_SYNTHETIC (internal) or DESTROY_STAGE_C_SYNTHETIC_1000_RUB (manual recovery)."
        required: true
        type: string
      source_sha:
        description: "Exact commit SHA used by the Stage C apply run."
        required: true
        type: string
      source_run_id:
        description: "GitHub Actions run ID of the Stage C apply workflow."
        required: true
        type: string
      hold_minutes:
        description: "Successful-apply field window. Automatic path allows 15-120; manual recovery may use 0."
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: host001-stage-c-recovery-teardown
  cancel-in-progress: false

jobs:
  teardown:
    name: Recover remote state and tear down reviewed Stage C resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: stage-c-yandex

    env:
      TF_VAR_app_zone: ru-central1-d
      TF_VAR_db_secondary_zone: ru-central1-b
      TF_VAR_postgresql_host_profile: single
      TF_VAR_vm_cores: "2"
      TF_VAR_vm_memory_gb: "4"
      TF_VAR_vm_disk_gb: "40"
      TF_VAR_postgresql_resource_preset_id: s3-c2-m8
      TF_VAR_postgresql_disk_type_id: network-ssd
      TF_VAR_postgresql_disk_size_gb: "20"
      TF_VAR_postgresql_backup_retain_days: "7"
      TF_VAR_field_test_resources_enabled: "true"
      TF_VAR_foundation_deletion_protection: "false"
      TF_VAR_field_test_restore_resource_preset_id: s3-c2-m8
      TF_VAR_field_test_restore_disk_size_gb: "20"
      TF_VAR_field_test_bucket_max_size_bytes: "1073741824"

    steps:
      - name: Validate teardown authorization and recovery coordinates
        shell: bash
        env:
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          case "$STAGE_C_ACKNOWLEDGEMENT" in
            AUTO_TEARDOWN_STAGE_C_SYNTHETIC|DESTROY_STAGE_C_SYNTHETIC_1000_RUB) ;;
            *)
              echo "Refusing teardown: invalid acknowledgement."
              exit 1
              ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be an exact 40-character commit SHA."
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "source_run_id must be numeric."
            exit 1
          }
          [[ "$HOLD_MINUTES" =~ ^[0-9]+$ ]] || {
            echo "hold_minutes must be an integer."
            exit 1
          }
          test "$HOLD_MINUTES" -ge 0
          test "$HOLD_MINUTES" -le 120
          if [ "$STAGE_C_ACKNOWLEDGEMENT" = "AUTO_TEARDOWN_STAGE_C_SYNTHETIC" ]; then
            test "$HOLD_MINUTES" -ge 15
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify exact recovery commit boundary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"

      - name: Materialize Yandex service-account key outside repository
        shell: bash
        env:
          YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" || {
            echo "Missing protected Stage C service-account key."
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/yc-stage-c-key.json"
          printf '%s' "$YC_STAGE_C_SERVICE_ACCOUNT_KEY_JSON" > "$key_file"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "yc-stage-c-key.json")
          data = json.load(open(path, encoding="utf-8"))
          required = {"id", "service_account_id", "private_key"}
          if not required.issubset(data):
              raise SystemExit("Invalid Yandex service-account key structure")
          PY
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Initialize durable Yandex Object Storage backend
        shell: bash
        env:
          TFSTATE_BUCKET: ${{ secrets.YC_STAGE_C_TFSTATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STAGE_C_TFSTATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STAGE_C_TFSTATE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$TFSTATE_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          terraform -chdir=infra/yandex-cloud init \
            -reconfigure \
            -input=false \
            -backend-config="bucket=$TFSTATE_BUCKET"
          terraform -chdir=infra/yandex-cloud validate

      - name: Wait for source apply result and bounded successful field window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_C_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail

          if [ "$STAGE_C_ACKNOWLEDGEMENT" = "AUTO_TEARDOWN_STAGE_C_SYNTHETIC" ]; then
            completed=0
            conclusion=""
            for _ in $(seq 1 120); do
              run_json="$(
                curl --fail-with-body --silent --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
              )"
              status="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
              if [ "$status" = "completed" ]; then
                conclusion="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
                completed=1
                break
              fi
              sleep 30
            done
            test "$completed" -eq 1 || {
              echo "Source apply run did not complete within the recovery observation window."
              exit 1
            }

            if [ "$conclusion" = "success" ]; then
              remaining=$((HOLD_MINUTES * 60))
            else
              echo "Source apply concluded $conclusion; skipping field window and tearing down immediately."
              remaining=0
            fi
          else
            remaining=$((HOLD_MINUTES * 60))
          fi

          while [ "$remaining" -gt 0 ]; do
            chunk=900
            if [ "$remaining" -lt "$chunk" ]; then
              chunk="$remaining"
            fi
            echo "Stage C synthetic field window: $(( (remaining + 59) / 60 )) minute(s) remaining."
            sleep "$chunk"
            remaining=$((remaining - chunk))
          done

      - name: Destroy reviewed Stage C resources from remote state
        id: destroy
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STAGE_C_TFSTATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STAGE_C_TFSTATE_SECRET_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_STAGE_C_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_STAGE_C_FOLDER_ID }}
          TF_VAR_admin_cidr: ${{ secrets.YC_STAGE_C_ADMIN_CIDR }}
          TF_VAR_ssh_public_key: ${{ secrets.YC_STAGE_C_SSH_PUBLIC_KEY }}
          TF_VAR_postgresql_app_password: ${{ secrets.YC_STAGE_C_POSTGRES_PASSWORD }}
          TF_VAR_field_test_restore_password: ${{ secrets.YC_STAGE_C_RESTORE_PASSWORD }}
        run: |
          set -euo pipefail
          destroy_plan="$RUNNER_TEMP/stage-c-destroy.tfplan"
          destroy_json="$RUNNER_TEMP/stage-c-destroy-plan.json"
          destroy_log="$RUNNER_TEMP/stage-c-destroy.stdout"

          set +e
          terraform -chdir=infra/yandex-cloud plan \
            -destroy \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out="$destroy_plan" >"$destroy_log" 2>&1
          plan_code=$?
          set -e

          if [ "$plan_code" -eq 0 ]; then
            echo "No Stage C resources remain in remote Terraform state."
            echo "had_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$plan_code" -ne 2 ]; then
            echo "Terraform destroy plan failed."
            exit "$plan_code"
          fi

          terraform -chdir=infra/yandex-cloud show -json "$destroy_plan" > "$destroy_json"

          jq -r '
            .resource_changes[]?
            | [.address, (.change.actions | join(","))]
            | @tsv
          ' "$destroy_json" | sort

          jq -e '
            all(
              .resource_changes[]?;
              all(.change.actions[]; . == "delete" or . == "read" or . == "no-op")
            )
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains an unexpected non-delete action."
            exit 1
          }

          jq -e '
            [
              .resource_changes[]?
              | select(.address | test(
                  "^(data\\.yandex_compute_image\\.ubuntu|yandex_vpc_network\\.main|yandex_vpc_subnet\\.(app|db_secondary)|yandex_vpc_security_group\\.(app|database)|yandex_vpc_address\\.app|yandex_iam_service_account\\.app|yandex_lockbox_secret\\.runtime|yandex_lockbox_secret_iam_member\\.runtime_payload|yandex_mdb_postgresql_cluster\\.main|yandex_mdb_postgresql_user\\.app|yandex_mdb_postgresql_database\\.app|yandex_compute_instance\\.app|yandex_resourcemanager_folder_iam_member\\.field_test_storage_uploader\\[0\\]|yandex_lockbox_secret\\.field_test_storage\\[0\\]|yandex_lockbox_secret_iam_member\\.field_test_storage_payload\\[0\\]|yandex_iam_service_account_static_access_key\\.field_test_storage\\[0\\]|yandex_storage_bucket\\.field_test\\[0\\]|yandex_mdb_postgresql_cluster\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_user\\.field_test_restore\\[0\\]|yandex_mdb_postgresql_database\\.field_test_restore\\[0\\])$"
                ) | not)
            ] | length == 0
          ' "$destroy_json" >/dev/null || {
            echo "Destroy plan contains a resource outside the reviewed Stage C allowlist."
            exit 1
          }

          terraform -chdir=infra/yandex-cloud apply \
            -auto-approve \
            -input=false \
            -no-color \
            "$destroy_plan" >"$destroy_log" 2>&1

          managed_count="$(terraform -chdir=infra/yandex-cloud state list 2>/dev/null | grep -vc '^data\.' || true)"
          test "$managed_count" -eq 0 || {
            echo "Managed resources remain in remote Terraform state after teardown."
            exit 1
          }
          echo "had_changes=true" >> "$GITHUB_OUTPUT"
          echo "Stage C teardown verified: no managed Terraform resources remain."

      - name: Record verified teardown
        if: success()
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HAD_CHANGES: ${{ steps.destroy.outputs.had_changes }}
        run: |
          {
            echo "### HOST-001 Stage C recovery teardown"
            echo
            printf -- '- Apply run ID: `%s`\n' "$SOURCE_RUN_ID"
            printf -- '- Apply commit: `%s`\n' "$SOURCE_SHA"
            echo "- Remote Terraform state backend: **Yandex Object Storage**"
            echo "- Terraform managed resources after teardown: **0**"
            echo "- Destroy changes applied: **$HAD_CHANGES**"
            echo "- Production data / Render / Neon / MIG-001 / real-data AI / email: **NOT TOUCHED**"
            echo "- Final manual cleanup: revoke the temporary backend static access key and delete the dedicated state bucket after evidence is captured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local recovery material
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/yc-stage-c-key.json" \
            "$RUNNER_TEMP/stage-c-destroy.tfplan" \
            "$RUNNER_TEMP/stage-c-destroy-plan.json" \
            "$RUNNER_TEMP/stage-c-destroy.stdout" \
            infra/yandex-cloud/.terraform
