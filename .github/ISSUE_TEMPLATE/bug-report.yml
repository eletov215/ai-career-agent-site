name: Bug report
description: Report a reproducible defect without sensitive or production data.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Use synthetic data. Never paste secrets, credentials, provider responses, logs containing personal data, or production records.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and sanitized inputs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or baseline SHA
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Impact and scope boundary
      description: State affected surfaces and surfaces that must not change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include safe errors or screenshots and remove all personal or secret material.
