name: Package implementation
description: Plan and deliver an approved package or focused repository change.
title: "[PACKAGE] "
labels: []
body:
  - type: input
    id: package-id
    attributes:
      label: Package ID / objective
      description: Identify the package and state its objective.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the observable conditions required for acceptance.
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: In scope
      description: List the allowed changes.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicitly out of scope
      description: List changes that must not be made.
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Baseline
      description: Provide the expected main branch commit SHA.
    validations:
      required: true
  - type: textarea
    id: inherited-guards
    attributes:
      label: Inherited guards
      description: Identify package, hash, evidence, security, and historical checks that must remain intact.
    validations:
      required: true
  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: List local tests, package guards, and required GitHub Actions.
    validations:
      required: true
  - type: textarea
    id: manual-qa
    attributes:
      label: Manual QA (if applicable)
      description: Describe manual checks or state NOT_RUN / not applicable.
  - type: textarea
    id: delivery-requirements
    attributes:
      label: Delivery requirements
      description: Specify branch, PR, evidence, CI, and merge constraints.
    validations:
      required: true
